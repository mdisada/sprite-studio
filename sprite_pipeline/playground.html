<title>Heroes Sprite Stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* One committed look: a lit stage in a dark room. Every colour is painted
     explicitly so the page holds on either host background. */
  :root{
    --ground:#0C0E14; --panel:#161A24; --panel2:#1D2230; --line:#272D3D;
    --text:#E8EBF4; --dim:#8F97B0; --amber:#F2B45C; --cool:#6FA8FF;
    --stage-top:#141722; --stage-bot:#1C2030;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    --pixel:"Silkscreen","IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);font:15px/1.55 var(--sans)}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 20px 44px}

  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin-bottom:4px}
  h1{font:400 20px/1 var(--pixel);margin:0;letter-spacing:.02em;color:var(--amber)}
  .sub{color:var(--dim);font-size:13.5px}
  .sub b{color:var(--text);font-weight:600}

  /* roster: the first thing you touch, so it sits above the stage */
  .roster{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;margin-top:14px;
          scrollbar-width:thin}
  .hero{flex:0 0 auto;width:92px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:6px 6px 8px;cursor:pointer;color:var(--dim);
        display:flex;flex-direction:column;align-items:center;gap:4px;
        transition:border-color .12s,color .12s,transform .12s}
  .hero:hover{border-color:#3C4560;color:var(--text)}
  .hero:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .hero canvas{width:76px;height:76px;image-rendering:pixelated;display:block}
  .hero .nm{font-size:11.5px;text-align:center;line-height:1.25;max-width:100%;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
            overflow:hidden;min-height:2.5em}
  .hero.on{border-color:var(--amber);color:var(--text);background:var(--panel2)}
  .hero.on .nm{font-weight:600}

  /* stage */
  .stage{position:relative;margin-top:10px;border:1px solid var(--line);
         border-radius:12px;overflow:hidden;background:var(--stage-bot)}
  canvas#cv{display:block;width:100%;height:56vh;min-height:320px;max-height:560px}
  .zoom{position:absolute;top:10px;right:10px;display:flex;gap:4px}
  .zoom button{font:400 11px/1 var(--pixel);color:var(--dim);background:#0F131Bcc;
        border:1px solid var(--line);border-radius:7px;padding:6px 8px;cursor:pointer}
  .zoom button:hover{color:var(--text);border-color:#3C4560}
  .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);
        font-size:12.5px;pointer-events:none;transition:opacity .4s}

  /* readout */
  .hud{display:flex;flex-wrap:wrap;gap:6px 22px;padding:9px 12px;margin-top:8px;
       background:var(--panel);border:1px solid var(--line);border-radius:9px;
       font:400 12.5px/1.4 var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
  .hud span b{color:var(--text);font-weight:500}
  .hud .k{color:var(--cool)}

  /* control pad */
  .pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
        gap:12px;margin-top:14px}
  .pad{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px 13px}
  .pad h2{margin:0 0 9px;font:400 11px/1 var(--pixel);color:var(--dim);letter-spacing:.04em}
  .btns{display:flex;flex-wrap:wrap;gap:6px}
  .ctl{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);
       color:var(--text);border:1px solid var(--line);border-radius:8px;
       padding:6px 10px 6px 7px;font:500 12.5px var(--sans);cursor:pointer;
       transition:border-color .1s,background .1s}
  .ctl:hover:not(:disabled){border-color:#3C4560}
  .ctl:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .ctl:disabled{opacity:.32;cursor:not-allowed}
  .ctl kbd{font:400 10.5px/1 var(--pixel);background:#0F131B;border:1px solid var(--line);
       border-bottom-width:2px;border-radius:5px;padding:4px 5px 3px;color:var(--dim)}
  .ctl.active{background:#3A2B14;border-color:var(--amber)}
  .ctl.active kbd{color:var(--amber);border-color:#5A431F}

  footer{margin-top:20px;color:var(--dim);font-size:12.5px;display:flex;
         flex-wrap:wrap;gap:4px 16px;align-items:baseline}
  footer b{color:var(--text);font-weight:600}

  @media (max-width:640px){
    .wrap{padding:16px 13px 34px}
    canvas#cv{height:44vh;min-height:240px}
    .hero{width:78px} .hero canvas{width:64px;height:64px}
  }
  @media (prefers-reduced-motion:reduce){.hero{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>Heroes Sprite Stage</h1>
    <div class="sub" id="tagline">Loading the roster&hellip;</div>
  </header>

  <div class="roster" id="roster" role="tablist" aria-label="Characters"></div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="zoom">
      <button type="button" onclick="zset(ZOOM*1.25)" aria-label="Zoom in">+</button>
      <button type="button" onclick="zset(ZOOM/1.25)" aria-label="Zoom out">&minus;</button>
      <button type="button" onclick="zset(1)" id="zreset">100%</button>
    </div>
    <div class="hint" id="hint">Hold <b>A</b> / <b>D</b> to walk &middot; <b>Shift</b> to run &middot; <b>Space</b> to jump</div>
  </div>

  <div class="hud" id="hud"></div>
  <div class="pads" id="pads"></div>

  <footer>
    <span id="credit"></span>
    <span>Sprites are baked into this page &mdash; nothing here changes the originals.</span>
  </footer>
</div>

<script>
"use strict";
const DATA = /*__DATA__*/;

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const hud=document.getElementById('hud');
function fit(){const r=cv.getBoundingClientRect();
  cv.width=Math.max(320,Math.round(r.width));cv.height=Math.max(240,Math.round(r.height));
  SCALE=Math.max(0.35,Math.min(1.2,cv.height*1.35/720));}
let SCALE=0.6, ZOOM=1;
addEventListener('resize',fit);

// ---------------------------------------------------------------- atlases
// One image per character holds every frame: animation `a` occupies a band at
// y = a.y, and frame i sits at x = i * a.fw. Decoding all of them at once
// would cost hundreds of MB, so only a few stay resident.
const IMGS=new Map(), LRU=[];
function loadAtlas(c){
  if(IMGS.has(c.id))return Promise.resolve(IMGS.get(c.id));
  return new Promise(res=>{
    const im=new Image();
    // onload, never decode(): decode() can hang forever in a background tab
    im.onload=()=>{IMGS.set(c.id,im);LRU.push(c.id);
      while(LRU.length>3){const drop=LRU.shift();if(drop!==CUR.id)IMGS.delete(drop);}
      res(im);};
    im.onerror=()=>res(null);
    im.src=c.atlas;
  });
}

// ------------------------------------------------------------- play state
let CUR=DATA.chars[0];
const P={x:0,facing:1,anim:'idle',frame:0,fpos:0,acc:0,locked:false,dead:false,queued:null};
const keys={};
let KEYMAP={};      // key -> animation name, rebuilt per character

const A=n=>CUR.anims[n];
function VIEW(){return SCALE*ZOOM;}
function charScale(){return CUR.scale||1;}
function animScale(n){const a=A(n);return (a&&a.scale!=null?a.scale:(a&&a.fix||1));}
function moveSpeed(n){const a=A(n);return (a&&a.move_speed!=null)?a.move_speed:0;}
function groundY(){return cv.height*0.82;}
function zset(z){ZOOM=Math.max(0.4,Math.min(2.5,z));
  document.getElementById('zreset').textContent=Math.round(ZOOM*100)+'%';}

// Behaviour is data on the animation, never a list of names here: anything
// the roster invents plays correctly as long as its spec says how it behaves.
function def(n){const a=A(n)||{};return{
  loop:!!a.loop, oneShot:!a.loop, useAction:!!a.use_action,
  stay:!!a.hold_last, interrupt:!!a.interrupt, rate:a.rate!=null?a.rate:1};}

// one-shots play only the clip's action window - the video these came from
// repeats the move to fill its length, a game wants exactly one
function range(n){
  const a=A(n); if(!a)return[0,0];
  const d=def(n), r=a.action_range, ok=r&&r[1]-r[0]>=2&&r[0]>=0;
  return (ok&&(a.range_manual||d.oneShot||d.useAction))
    ? [r[0],Math.min(r[1],a.n)] : [0,a.n];
}
function setAnim(n,opts){
  if(!A(n))return;
  if(P.anim===n&&!(opts&&opts.force))return;
  const [s,e]=range(n);
  P.anim=n;P.acc=0;
  P.frame=(opts&&opts.phase)?Math.min(e-1,s+Math.floor(opts.phase*(e-s))):s;
  P.fpos=P.frame;P.locked=def(n).oneShot;
}
function trigger(n){
  if(P.dead){P.dead=false;P.locked=false;setAnim('idle',{force:true});return;}
  if(!n||!A(n))return;
  if(def(n).interrupt){P.locked=false;setAnim(n,{force:true});}
  else if(P.locked)P.queued=n;
  else setAnim(n);
}
function jumpOrLeap(){
  const running=P.anim==='run'||P.anim==='leap'||(keys['shift']&&(keys['a']||keys['d']));
  return (running&&A('leap'))?'leap':'jump';
}

// --------------------------------------------------------------- controls
// key, label, and the animations that can satisfy it (first one present wins)
const PADS=[
  {title:'Move',btns:[
    {id:'walkL',key:'a',label:'walk left',hold:'a',needs:['walk']},
    {id:'walkR',key:'d',label:'walk right',hold:'d',needs:['walk']},
    {id:'run',key:'shift',label:'run',toggle:'shift',needs:['run']},
    {id:'jump',key:' ',keyLabel:'space',label:'jump',tapf:jumpOrLeap,needs:['jump']},
    {id:'leap',keyLabel:'shift+space',label:'leap',tapf:()=>'leap',needs:['leap']},
  ]},
  {title:'Fight',btns:[
    {id:'attack',key:'f',label:'attack',needs:['attack']},
    {id:'cast',key:'1',label:'cast',needs:['skill_cast','cast']},
    {id:'aoe',key:'2',label:'area skill',needs:['skill_aoe']},
    {id:'tempo',key:'3',label:'tempo skill',needs:['skill_tempo']},
    {id:'guard',key:'e',label:'guard',hold:'e',needs:['guard']},
  ]},
  {title:'React',btns:[
    {id:'hit',key:'z',label:'take a hit',needs:['hit']},
    {id:'death',key:'x',label:'death',needs:['death']},
    {id:'victory',key:'v',label:'victory',needs:['victory']},
  ]},
];
const SPARE='456789qrtybnm'.split('');
const KEYLABEL={' ':'space',shift:'shift'};
function resolve(needs){return (needs||[]).find(n=>A(n))||null;}

function buildControls(){
  const host=document.getElementById('pads');
  host.innerHTML='';
  KEYMAP={};
  const used=new Set();
  const pads=PADS.map(p=>({title:p.title,btns:p.btns.map(b=>{
    const anim=resolve(b.needs); if(anim)used.add(anim);
    return Object.assign({},b,{anim});
  })}));
  // every remaining animation gets a spare key, so nothing is unreachable
  const spare=SPARE.slice();
  const extra=Object.keys(CUR.anims)
    .filter(n=>!used.has(n)&&n!=='idle'&&n!=='fall')
    .map(n=>{const k=spare.shift();
      return {id:'x_'+n,key:k,label:n.replace(/_/g,' '),anim:n,needs:[n]};});
  if(extra.length)pads.push({title:'More',btns:extra});

  pads.forEach(p=>{
    if(!p.btns.some(b=>b.anim))return;
    const el=document.createElement('div');el.className='pad';
    el.innerHTML='<h2>'+p.title+'</h2>';
    const row=document.createElement('div');row.className='btns';
    p.btns.forEach(b=>{
      const btn=document.createElement('button');
      btn.type='button';btn.className='ctl';btn.id='btn_'+b.id;
      btn.innerHTML='<kbd>'+(b.keyLabel||b.key||'&mdash;').toUpperCase()+'</kbd>'+b.label;
      if(!b.anim){btn.disabled=true;btn.title='this hero has no '+b.label+' animation';}
      else{
        if(b.key)KEYMAP[b.key]=b;
        if(b.hold){
          const on=()=>{keys[b.hold]=true;btn.classList.add('active');};
          const off=()=>{keys[b.hold]=false;btn.classList.remove('active');};
          btn.addEventListener('pointerdown',e=>{e.preventDefault();on();});
          ['pointerup','pointerleave','pointercancel'].forEach(t=>btn.addEventListener(t,off));
        }else if(b.toggle){
          btn.addEventListener('click',()=>{keys[b.toggle]=!keys[b.toggle];
            btn.classList.toggle('active',keys[b.toggle]);});
        }else{
          btn.addEventListener('click',()=>{trigger(b.tapf?b.tapf():b.anim);flash(btn);});
        }
      }
      row.appendChild(btn);
    });
    el.appendChild(row);host.appendChild(el);
  });
}
function flash(btn){btn.classList.add('active');setTimeout(()=>btn.classList.remove('active'),140);}
function light(k,on){
  const b=KEYMAP[k]; if(!b)return;
  const el=document.getElementById('btn_'+b.id); if(el)el.classList.toggle('active',on);
  if(b.id==='jump'){const l=document.getElementById('btn_leap');
    if(l)l.classList.toggle('active',on&&jumpOrLeap()==='leap');}
}
addEventListener('keydown',e=>{
  const k=e.key===' '?' ':e.key.toLowerCase();
  if(['INPUT','TEXTAREA','SELECT'].includes((e.target||{}).tagName))return;
  if(k==='['||k===']'){pick(DATA.chars[(DATA.chars.indexOf(CUR)+(k===']'?1:DATA.chars.length-1))%DATA.chars.length].id);e.preventDefault();return;}
  keys[k]=true;light(k,true);
  const b=KEYMAP[k];
  if(b&&!b.hold&&!b.toggle){trigger(b.tapf?b.tapf():b.anim);e.preventDefault();}
  if(k===' ')e.preventDefault();
  hideHint();
});
addEventListener('keyup',e=>{const k=e.key===' '?' ':e.key.toLowerCase();keys[k]=false;light(k,false);});
addEventListener('blur',()=>{for(const k in keys){keys[k]=false;light(k,false);}});
let hintGone=false;
function hideHint(){if(hintGone)return;hintGone=true;
  const h=document.getElementById('hint');h.style.opacity=0;}

// --------------------------------------------------------------- rendering
function drawChar(a,frameIdx,x,anchorY,facing,scale,alpha){
  const img=IMGS.get(CUR.id); if(!img||!a)return;
  const b=a.crop_box, bw=b[2]-b[0], bh=b[3]-b[1];
  const R=VIEW()*(scale||1);
  const anchorX=(a.footx!=null)?a.footx:(b[0]+b[2])/2;
  const cxOff=((b[0]+b[2])/2-anchorX)*R;
  const footOff=(a.ground_y!=null?Math.min(Math.max(a.ground_y,b[1]),b[3]):b[3])-b[1];
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.imageSmoothingEnabled=false;      // 32-bit pixel art: keep the pixels hard
  ctx.translate(x,0);ctx.scale(facing,1);
  ctx.drawImage(img, Math.min(frameIdx,a.n-1)*a.fw, a.y, a.fw, a.fh,
                cxOff-bw*R/2, anchorY-footOff*R, bw*R, bh*R);
  ctx.restore();
}

let last=performance.now();
function tick(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  let a=A(P.anim);
  if(a){
    const d=def(P.anim), [rs,re]=range(P.anim);
    const cad=a.fps||12;
    const step=d.rate||1;      // the speed tuned in the studio, as authored
    P.acc+=dt;
    while(P.acc>1/cad){
      P.acc-=1/cad;
      P.fpos+=step;P.frame=Math.floor(P.fpos);
      if(P.frame>=re){
        if(d.loop){P.fpos=rs+((P.fpos-rs)%Math.max(1,re-rs));P.frame=Math.floor(P.fpos);}
        else if(d.stay){P.frame=re-1;P.fpos=P.frame;P.dead=true;}
        else{P.locked=false;const q=P.queued;P.queued=null;
             setAnim(q&&A(q)?q:'idle',{force:true});}
      }
    }
  }
  if(!P.locked&&!P.dead){
    const left=keys['a'],right=keys['d'],run=keys['shift'];
    if(keys['e'])setAnim('guard');
    else if(left||right){
      const target=(run&&A('run'))?'run':(A('walk')?'walk':(A('run')?'run':null));
      if(target){
        if(P.anim!==target){
          const [ps,pe]=range(P.anim);
          const ph=(P.anim==='walk'||P.anim==='run')?(P.frame-ps)/Math.max(1,pe-ps):0;
          setAnim(target,{phase:ph});
        }
        P.facing=right?1:-1;
        P.x+=(right?1:-1)*moveSpeed(target)*dt;
      }
    } else if(def(P.anim).loop&&P.anim!=='idle')setAnim('idle');
  } else {
    const sp=moveSpeed(P.anim);
    if(sp)P.x+=P.facing*sp*dt;
  }
  P.x=Math.max(-cv.width*0.42,Math.min(cv.width*0.42,P.x));

  // draw: re-read the clip, a one-shot may have ended inside this tick and
  // drawing the old frames at the new animation's scale is a visible pop
  a=A(P.anim)||a;
  const g=ctx.createLinearGradient(0,0,0,cv.height);
  g.addColorStop(0,'#141722');g.addColorStop(1,'#1C2030');
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#232840';ctx.fillRect(0,groundY(),cv.width,3);

  const cx=cv.width/2+P.x;
  if(a){
    const bw=(a.crop_box[2]-a.crop_box[0])*VIEW()*animScale(P.anim)*charScale();
    ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(cx,groundY()+7,bw*0.3,bw*0.085,0,0,Math.PI*2);
    ctx.fill();ctx.restore();
    drawChar(a,P.frame,cx,groundY(),P.facing,animScale(P.anim)*charScale(),1);
  }
  const held=Object.keys(keys).filter(k=>keys[k]).map(k=>KEYLABEL[k]||k);
  hud.innerHTML='<span><b>'+esc(CUR.name)+'</b></span>'
    +'<span>'+esc(P.anim.replace(/_/g,' '))+' &middot; frame <b>'+(P.frame+1)+'</b>/'+(a?a.n:0)
    +' at '+(a?a.fps:12)+'fps</span>'
    +'<span>x <b>'+Math.round(P.x)+'</b></span>'
    +'<span class="k">'+(held.length?held.join(' + '):'&mdash;')+'</span>';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

// ------------------------------------------------------------------- boot
// Every clip is normalised to idle's height: the video model sometimes renders
// one animation much bigger, and stand_h (measured at export) says by how much.
function normalize(c){
  const base=c.anims.idle&&c.anims.idle.stand_h;
  for(const k in c.anims){
    const st=c.anims[k].stand_h;
    c.anims[k].fix=(base&&st)?Math.max(0.4,Math.min(2.5,base/st)):1;
  }
}
async function pick(id){
  const c=DATA.chars.find(x=>x.id===id); if(!c)return;
  CUR=c;
  P.x=0;P.facing=1;P.queued=null;P.dead=false;P.locked=false;
  setAnim('idle',{force:true});
  for(const k in keys)keys[k]=false;
  document.querySelectorAll('.hero').forEach(el=>{
    const on=el.dataset.id===id;
    el.classList.toggle('on',on);el.setAttribute('aria-selected',on?'true':'false');});
  buildControls();
  document.getElementById('credit').textContent=
    c.name+' · '+Object.keys(c.anims).length+' animations';
  await loadAtlas(c);
}
function portrait(c,img){
  const a=c.anims.idle, cvp=document.createElement('canvas');
  cvp.width=cvp.height=76;
  const g=cvp.getContext('2d');g.imageSmoothingEnabled=false;
  const s=Math.min(76/a.fw,76/a.fh);
  const w=a.fw*s,h=a.fh*s;
  g.drawImage(img,0,a.y,a.fw,a.fh,(76-w)/2,(76-h)/2,w,h);
  return cvp;
}
(async function(){
  DATA.chars.forEach(normalize);
  const roster=document.getElementById('roster');
  document.getElementById('tagline').innerHTML=
    '<b>'+DATA.chars.length+' heroes</b> from the sprite pipeline. Pick one, then use the keys or the buttons.';
  fit();
  setInterval(()=>tick(performance.now()),33);   // interval, not rAF: keeps
                                                 // running in embedded panes
  for(const c of DATA.chars){
    const el=document.createElement('button');
    el.type='button';el.className='hero';el.dataset.id=c.id;
    el.setAttribute('role','tab');
    el.addEventListener('click',()=>pick(c.id));
    const nm=document.createElement('div');nm.className='nm';nm.textContent=c.name;
    const img=await loadAtlas(c);
    if(img)el.appendChild(portrait(c,img));
    el.appendChild(nm);
    roster.appendChild(el);
  }
  await pick(DATA.chars[0].id);
})();
</script>
